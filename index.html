<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>给你的小书</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23cf878d' d='M12 20.4C6.3 16.4 3.4 12.8 3.4 9.4c0-2.6 2-4.5 4.4-4.5 1.7 0 3.3.9 4.2 2.4.9-1.5 2.5-2.4 4.2-2.4 2.4 0 4.4 1.9 4.4 4.5 0 3.4-2.9 7-8.6 11z'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f8f1e4;
    --paper-deep:#efe2cf;
    --ink:#4b4038;
    --ink-soft:#877668;
    --line:#e4d7c3;
    --pink:#cf878d;
    --pink-soft:#eed3d2;
    --tape:rgba(226,193,140,.55);
    --note:#fbf1bd;
    --hand:"Kaiti SC","KaiTi","STKaiti","楷体","Kaiti TC","Segoe Script",cursive,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--hand);
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, #fdf8ef 0%, rgba(253,248,239,0) 46%),
      radial-gradient(circle at 88% 82%, #f1e5d2 0%, rgba(241,229,210,0) 52%),
      #f3eadb;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.055;z-index:90;mix-blend-mode:multiply}
  .scene{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 18px 48px;
    position:relative;
  }
  [hidden]{display:none !important}
  .fade-in{animation:fadeUp .7s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- 封面 ---------- */
  .cover{
    position:relative;
    width:100%;
    max-width:370px;
    padding:46px 30px 34px;
    background:linear-gradient(104deg,#f2e4cf,#fbf6ec 24%,#f8f0e1);
    border-radius:4px 16px 16px 4px;
    box-shadow:0 22px 48px rgba(122,96,68,.22),0 1px 0 #fff inset;
    text-align:center;
    transform:rotate(-.8deg);
  }
  .cover::before{
    content:"";
    position:absolute;left:15px;top:0;bottom:0;width:9px;
    background:linear-gradient(90deg,rgba(160,130,96,.3),rgba(160,130,96,0));
    border-right:1px solid rgba(160,130,96,.16);
  }
  .tape{
    position:absolute;
    background:var(--tape);
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 2px,rgba(255,255,255,0) 2px 6px);
    box-shadow:0 2px 7px rgba(122,96,68,.14);
  }
  .cover .tape{top:-13px;left:50%;width:98px;height:27px;transform:translateX(-50%) rotate(-2.5deg)}
  .cover-to{font-size:14px;letter-spacing:.32em;color:var(--ink-soft);margin:0}
  .cover-name{font-size:34px;margin:14px 0 0;letter-spacing:.06em;line-height:1.3}
  .cover-rule{width:54px;height:2px;background:var(--pink-soft);margin:18px auto;border-radius:2px}
  .cover-sub{font-size:15px;color:var(--ink-soft);line-height:2;margin:0}
  .cover-btn{
    margin-top:26px;
    font-family:inherit;
    font-size:16px;
    letter-spacing:.16em;
    color:var(--ink);
    background:rgba(255,255,255,.5);
    border:1px dashed #cbb59a;
    border-radius:999px;
    padding:11px 30px;
    cursor:pointer;
    transition:transform .25s,background .25s,box-shadow .25s;
  }
  .cover-btn:hover,.cover-btn:focus-visible{
    background:#fffdf7;
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(122,96,68,.14);
    outline:none;
  }
  .cover-stamp{
    position:absolute;right:18px;bottom:16px;
    width:54px;height:54px;border-radius:50%;
    border:1.5px dashed rgba(180,120,120,.55);
    color:rgba(180,120,120,.8);
    font-size:10px;line-height:1.35;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-12deg);
    letter-spacing:.06em;
  }

  /* ---------- 游戏页 ---------- */
  .game{justify-content:flex-start;padding-top:34px;gap:16px}
  .hud{width:min(100%,520px);display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
  .hud-text p{margin:0}
  .hud-title{font-size:18px;letter-spacing:.02em}
  .hud-sub{font-size:13.5px;color:var(--ink-soft);margin-top:5px !important}
  .pips{display:flex;gap:3px;font-size:19px;color:#cbb9a4;letter-spacing:0;line-height:1}
  .pips span{transition:color .3s,transform .3s}
  .pips span.on{color:var(--pink);transform:scale(1.15)}

  .desk{
    position:relative;
    width:min(100%,520px);
    aspect-ratio:4/5;
    background:#fcf7ec;
    border-radius:8px;
    box-shadow:0 18px 40px rgba(122,96,68,.18),0 1px 0 #fff inset;
    overflow:hidden;
    background-image:
      repeating-linear-gradient(to bottom,transparent 0 27px,rgba(196,178,152,.35) 27px 28px);
    background-position:0 34px;
  }
  .desk::before{
    content:"";
    position:absolute;top:0;bottom:0;left:9%;
    border-left:1px solid rgba(199,140,140,.35);
    pointer-events:none;
  }
  .desk-tape-1{top:-10px;left:-10px;width:104px;height:26px;transform:rotate(-32deg)}
  .desk-tape-2{bottom:-10px;right:-12px;width:104px;height:24px;transform:rotate(-28deg)}
  .desk-tape-3{left:24%;top:47%;width:36%;height:20px;transform:rotate(-7deg);opacity:.75}
  .coffee{
    position:absolute;left:6%;top:38%;width:30%;aspect-ratio:1;border-radius:50%;
    border:8px solid rgba(190,160,120,.16);
    box-shadow:inset 0 0 0 1px rgba(190,160,120,.1);
    pointer-events:none;
  }
  .note{
    position:absolute;right:5%;top:5%;width:44%;min-height:27%;
    background:var(--note);
    background-image:repeating-linear-gradient(to bottom,transparent 0 21px,rgba(190,170,120,.22) 21px 22px);
    box-shadow:0 8px 16px rgba(140,110,70,.16),0 1px 0 rgba(255,255,255,.6) inset;
    transform:rotate(3.2deg);
    padding:16px 12px 12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;
    pointer-events:none;
    color:#6d5d46;
  }
  .note::before{
    content:"";position:absolute;top:-9px;left:50%;width:64px;height:20px;
    transform:translateX(-50%) rotate(-3deg);
    background:var(--tape);
  }
  .note b{font-size:15px;letter-spacing:.1em;font-weight:400}
  .note em{font-size:12.5px;font-style:normal;opacity:.75;letter-spacing:.04em}

  .item{
    position:absolute;
    left:var(--x);top:var(--y);
    width:8%;aspect-ratio:1;
    padding:0;border:0;background:none;
    color:#8d7d69;
    opacity:.3;
    transform:translate(-50%,-50%) rotate(var(--r));
    cursor:pointer;
    transition:opacity .3s,transform .3s,color .3s;
    touch-action:manipulation;
  }
  .item::before{content:"";position:absolute;inset:-12px}
  .item svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .item:hover,.item:focus-visible{
    opacity:1;color:var(--pink);
    transform:translate(-50%,-50%) rotate(var(--r)) scale(1.14);
    outline:none;
  }
  .item.found{
    opacity:1;color:var(--pink);cursor:default;
    transform:translate(-50%,-50%) rotate(var(--r)) scale(1.06);
  }
  .item.found::after{
    content:"";position:absolute;inset:-9px;
    border:1px dashed rgba(207,135,141,.55);border-radius:50%;
    animation:popRing .5s ease both;
  }
  @keyframes popRing{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .item.hint{animation:hintPulse 1.1s ease-in-out 2}
  @keyframes hintPulse{
    0%,100%{opacity:.3;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}
    50%{opacity:1;color:var(--pink);transform:translate(-50%,-50%) rotate(var(--r)) scale(1.35)}
  }
  .item.shake{animation:shake .4s ease}
  @keyframes shake{
    0%,100%{transform:translate(-50%,-50%) rotate(var(--r))}
    25%{transform:translate(-53%,-50%) rotate(calc(var(--r) - 5deg))}
    75%{transform:translate(-47%,-50%) rotate(calc(var(--r) + 5deg))}
  }
  .desk-caption{font-size:12.5px;color:var(--ink-soft);letter-spacing:.1em;margin:0}

  .hint-btn{
    font-family:inherit;font-size:14px;color:var(--ink-soft);
    background:none;border:1px dashed #cdb99f;border-radius:999px;
    padding:8px 18px;cursor:pointer;transition:.25s;
  }
  .hint-btn:hover,.hint-btn:focus-visible{color:var(--ink);border-color:var(--pink);outline:none}

  .unlock{
    width:min(100%,520px);
    text-align:center;
    padding:6px 0 10px;
    animation:fadeUp .6s ease both;
  }
  .unlock p{margin:0 0 14px;font-size:16px;color:var(--ink-soft)}
  .seal-btn{
    font-family:inherit;font-size:17px;letter-spacing:.18em;
    color:#8a4f52;background:#fffdf7;
    border:1.5px dashed rgba(207,135,141,.75);
    border-radius:999px;padding:12px 34px;cursor:pointer;
    box-shadow:0 8px 18px rgba(207,135,141,.16);
    transition:.25s;
  }
  .seal-btn:hover,.seal-btn:focus-visible{transform:translateY(-2px);background:#fff;box-shadow:0 12px 22px rgba(207,135,141,.24);outline:none}

  /* ---------- 内容页 ---------- */
  .reward{
    display:block;
    padding:44px 18px 70px;
  }
  .wrap{width:100%;max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .counter{
    background:#fffdf6;border-radius:14px;padding:20px 22px;
    box-shadow:0 12px 26px rgba(122,96,68,.13);
    position:relative;transform:rotate(-.5deg);text-align:center;
  }
  .counter::before{content:"";position:absolute;top:-10px;left:26px;width:74px;height:22px;background:var(--tape);transform:rotate(-4deg)}
  .counter p{margin:0}
  .counter .c-label{font-size:14px;color:var(--ink-soft);letter-spacing:.14em}
  .counter .c-num{font-size:44px;color:var(--pink);line-height:1.25;letter-spacing:.02em}
  .counter .c-unit{font-size:14px;color:var(--ink-soft)}

  .letter{
    position:relative;
    background-color:#fffdf5;
    background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(208,190,163,.42) 31px 32px);
    border-radius:6px;
    padding:34px 26px 30px 40px;
    box-shadow:0 16px 34px rgba(122,96,68,.14);
    font-size:17px;
    line-height:32px;
    color:#54483e;
  }
  .letter::before{
    content:"";position:absolute;top:0;bottom:0;left:24px;
    border-left:1px solid rgba(199,140,140,.4);
  }
  .letter h2{
    font-size:20px;font-weight:400;letter-spacing:.06em;
    margin:0 0 32px;line-height:32px;
  }
  .letter p{margin:0 0 32px;text-indent:2em}
  .letter .sign{text-align:right;text-indent:0;margin:0;color:var(--ink-soft);font-size:16px}
  .clip{
    position:absolute;top:-16px;right:26px;width:16px;height:44px;
    border:2px solid rgba(150,150,150,.5);border-radius:9px;
    border-bottom-color:transparent;
    transform:rotate(8deg);
  }

  .section-label{
    font-size:14px;color:var(--ink-soft);letter-spacing:.16em;
    margin:6px 0 -6px;text-align:center;
  }
  .chats{display:grid;grid-template-columns:1fr;gap:22px}
  .chat-card{
    background:#fdf8ee;border-radius:14px;padding:22px 16px 16px;
    box-shadow:0 12px 26px rgba(122,96,68,.13);
    position:relative;
    transform:rotate(-.6deg);
  }
  .chat-card:nth-child(2n){transform:rotate(.7deg)}
  .chat-card::before{
    content:"";position:absolute;top:-10px;left:50%;width:78px;height:21px;
    transform:translateX(-50%) rotate(-2deg);background:var(--tape);
  }
  .chat-date{text-align:center;font-size:12.5px;color:var(--ink-soft);letter-spacing:.12em;margin-bottom:12px}
  .bubble{
    max-width:82%;padding:9px 14px;border-radius:14px;
    font-size:15.5px;line-height:1.55;margin-bottom:9px;
    color:#50443a;
  }
  .bubble:last-child{margin-bottom:0}
  .bubble.him{background:#ece4d6;border-bottom-left-radius:4px}
  .bubble.me{background:var(--pink-soft);border-bottom-right-radius:4px;margin-left:auto}

  .final{text-align:center;padding:8px 0 0}
  .final-tip{font-size:14px;color:var(--ink-soft);margin:0 0 14px;letter-spacing:.06em}
  .heart-btn{
    background:none;border:0;padding:6px;cursor:pointer;
    color:var(--pink);opacity:.85;transition:.3s;
    animation:beat 2.4s ease-in-out infinite;
  }
  .heart-btn svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
  .heart-btn:hover,.heart-btn:focus-visible{opacity:1;transform:scale(1.1);outline:none}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
  .final-secret{
    max-width:460px;margin:18px auto 0;
    font-size:17px;line-height:2;color:#5c4f44;
    opacity:0;transform:translateY(8px);
    transition:opacity .8s,transform .8s;
  }
  .final-secret.show{opacity:1;transform:translateY(0)}
  .foot{margin:26px 0 0;text-align:center;font-size:12.5px;color:#a3937f;letter-spacing:.12em}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:30px;z-index:120;
    max-width:min(88vw,430px);
    background:#fffdf6;border:1px solid #e8dac4;border-radius:14px;
    padding:13px 20px;
    font-size:16px;line-height:1.7;text-align:center;color:#574a3f;
    box-shadow:0 14px 30px rgba(122,96,68,.18);
    opacity:0;transform:translate(-50%,16px);
    pointer-events:none;transition:opacity .35s,transform .35s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (min-width:720px){
    .desk{width:min(100%,540px)}
    .letter{padding:40px 38px 34px 50px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<!-- 纸张颗粒质感 -->
<svg class="grain" aria-hidden="true">
  <filter id="grainFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grainFilter)"/>
</svg>

<!-- 手绘小图标 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path d="M12 20.4C6.3 16.4 3.4 12.8 3.4 9.4c0-2.6 2-4.5 4.4-4.5 1.7 0 3.3.9 4.2 2.4.9-1.5 2.5-2.4 4.2-2.4 2.4 0 4.4 1.9 4.4 4.5 0 3.4-2.9 7-8.6 11z"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="M12 3.3l2.5 5.4 5.9.7-4.4 4 1.2 5.7-5.2-2.9-5.2 2.9 1.2-5.7-4.4-4 5.9-.7z"/>
    </symbol>
    <symbol id="i-flower" viewBox="0 0 24 24">
      <ellipse cx="12" cy="7.3" rx="2.1" ry="3"/>
      <ellipse cx="12" cy="7.3" rx="2.1" ry="3" transform="rotate(72 12 12)"/>
      <ellipse cx="12" cy="7.3" rx="2.1" ry="3" transform="rotate(144 12 12)"/>
      <ellipse cx="12" cy="7.3" rx="2.1" ry="3" transform="rotate(216 12 12)"/>
      <ellipse cx="12" cy="7.3" rx="2.1" ry="3" transform="rotate(288 12 12)"/>
      <circle cx="12" cy="12" r="2"/>
      <path d="M12 14v7"/>
      <path d="M12 18.2c1.5-.8 3-.5 3.9.3-1.1 1.2-3 1.3-3.9-.3z"/>
    </symbol>
    <symbol id="i-stamp" viewBox="0 0 24 24">
      <circle cx="9.4" cy="13.6" r="5.7" stroke-dasharray="1.6 2.2"/>
      <path d="M9.4 15.7c-1.8-1.3-2.9-2.4-2.9-3.6 0-.9.7-1.6 1.5-1.6.5 0 1 .3 1.4.8.4-.5.9-.8 1.4-.8.8 0 1.5.7 1.5 1.6 0 1.2-1.1 2.3-2.9 3.6z"/>
      <path d="M16 8.9c1.5 1.2 4 1.2 5.5 0"/>
      <path d="M16 13.4c1.5 1.2 4 1.2 5.5 0"/>
      <path d="M16 17.9c1.5 1.2 4 1.2 5.5 0"/>
    </symbol>
    <symbol id="i-key" viewBox="0 0 24 24">
      <circle cx="7.6" cy="7.9" r="3.6"/>
      <path d="M10.3 10.6l8.3 8.3"/>
      <path d="M15.3 15.6l1.9-1.9"/>
      <path d="M17.7 18l1.9-1.9"/>
    </symbol>
    <symbol id="i-plane" viewBox="0 0 24 24">
      <path d="M20.6 4.1L3.3 10.6l6.6 2.6 2.5 6.7z"/>
      <path d="M9.9 13.2l10.7-9.1"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M16.4 4.3a8.1 8.1 0 103.2 13A8.7 8.7 0 0116.4 4.3z"/>
    </symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24">
      <path d="M4.8 19.2c0-8.2 5-13.2 14.4-13.2 0 9.1-5 13.2-14.4 13.2z"/>
      <path d="M8.3 15.7c2.5-2.5 5.5-4.5 8.5-5.6"/>
    </symbol>
  </defs>
</svg>

<!-- ========== 1. 封面 ========== -->
<section class="scene" id="cover">
  <div class="cover">
    <div class="tape"></div>
    <p class="cover-to">致</p>
    <h1 class="cover-name" id="coverName">小朋友</h1>
    <div class="cover-rule"></div>
    <p class="cover-sub">一份小小的、<br>只写给你的东西</p>
    <button class="cover-btn" id="startBtn">翻 开</button>
    <div class="cover-stamp">私<br>人<br>收</div>
  </div>
</section>

<!-- ========== 2. 找东西 ========== -->
<section class="scene game" id="game" hidden>
  <div class="hud">
    <div class="hud-text">
      <p class="hud-title" id="hudTitle">这页手账里藏了 5 件小东西</p>
      <p class="hud-sub">找齐了才能拆信哦</p>
    </div>
    <div class="pips" id="pips" aria-hidden="true"></div>
  </div>

  <div class="desk" id="desk">
    <div class="tape desk-tape-1"></div>
    <div class="tape desk-tape-3"></div>
    <div class="tape desk-tape-2"></div>
    <div class="coffee" aria-hidden="true"></div>
    <div class="note" aria-hidden="true">
      <b>今天也想你</b>
      <em>——记于 某个下午</em>
    </div>
  </div>

  <p class="desk-caption">第 1 页 · 共 1 页</p>
  <button class="hint-btn" id="hintBtn">偷偷提示</button>

  <div class="unlock" id="unlock" hidden>
    <p>五件都找到了，辛苦了。</p>
    <button class="seal-btn" id="sealBtn">拆 开 这 封 信</button>
  </div>
</section>

<!-- ========== 3. 内容 ========== -->
<section class="reward" id="reward" hidden>
  <div class="wrap">
    <div class="counter">
      <p class="c-label">这是我们在一起的第</p>
      <p class="c-num" id="dayNum">—</p>
      <p class="c-unit">天</p>
    </div>

    <article class="letter">
      <div class="clip" aria-hidden="true"></div>
      <h2 id="letterTitle">写给你的第一封手写信</h2>
      <div id="letterBody"></div>
      <p class="sign" id="letterSign"></p>
    </article>

    <p class="section-label">— 一些被存下来的对话 —</p>
    <div class="chats" id="chats"></div>

    <div class="final">
      <p class="final-tip">还有一句话，藏在这颗心里。</p>
      <button class="heart-btn" id="finalHeart" aria-label="点开最后一句话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"></use></svg>
      </button>
      <p class="final-secret" id="finalSecret"></p>
    </div>

    <p class="foot">made with 一点点笨拙的喜欢</p>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   所有要改的内容都在这里。
   换文字只需要改引号里的中文，别动引号、逗号和括号。
   ============================================================ */
const CONFIG = {
  hisName: "哥哥",                   // 改成他的昵称
  fromName: "可爱老婆宝宝",                    // 落款
  startDate: "2026-09-27T00:00:00+08:00",  // 在一起的日期和时间

  // 藏起来的 5 件小东西，icon 可选：heart / star / flower / stamp / key
  finds: [
    { icon: "heart",  x: "26%", y: "30%", r: "-9deg",
      text: "崇拜你，我的哥哥～" },
    { icon: "star",   x: "68%", y: "44%", r: "8deg",
      text: "总有些惊奇的际遇，比方说当我遇见你。" },
    { icon: "flower", x: "40%", y: "66%", r: "-6deg",
      text: "谢谢你，一直能发现我隐藏起来的脆弱，我很幸福。" },
    { icon: "stamp",  x: "76%", y: "74%", r: "12deg",
      text: "鸡蛋鸡蛋鸡蛋和你见面。" },
    { icon: "key",    x: "22%", y: "82%", r: "-14deg",
      text: "夸张夸张夸张。" }
  ],

  // 捣乱用的假线索
  decoys: [
    { icon: "plane", x: "52%", y: "24%", r: "10deg" },
    { icon: "moon",  x: "86%", y: "56%", r: "-8deg" },
    { icon: "leaf",  x: "48%", y: "90%", r: "6deg" }
  ],

  letter: {
    title: "写给我的哥哥",
    paragraphs: [
      "其实在遇见你之前，我不相信有人可以读懂我的欲言又止。",
      "也不相信除了我妈妈，还有人可以了解最真实的我之后，还欣赏我，用心地对我表达我很可爱，还愿意呵护我这份小孩子的样子。",
      "谢谢你来到我身边爱我，我会好好珍惜你的！"
    ],
    ps: "P.S. 刚才那五件小东西是我故意藏起来的。找得辛苦啦，抱一下。"
  },

  // 聊天记录，who 填 him（他说的）或 me（你说的）
  chats: [
    {
      date: "",
      bubbles: [
        { who: "him", text: "主要是以后总要说的嘛，或早或晚。" },
        { who: "him", text: "其实当时臭宝宝你这个反应的时候，我就感觉出来你肯定有点小心思不对劲了。" },
        { who: "him", text: "我说踩雷区也是想问你——什么事情或者什么想法让你有这种情绪的？当时就各种猜，我就差一步就猜到了，没想到是我说的那句话让你误会了。" },
        { who: "him", text: "我还在自己的那个逻辑里面，因为我根本没想调侃你没当过姐姐，所以也不可能很快分析出来是这方面原因，小宝宝，我也很懵。" },
        { who: "him", text: "那你和我说完我才知道呀，我觉得宝宝能和我说出来就很棒。" },
        { who: "him", text: "我疑惑的点也在这里，可能我这点确实没办法和宝宝感同身受，所以只有说出来，我以后才会更多地在乎和照顾你。" },
        { who: "him", text: "我知道小宝宝心里肯定是渴望被照顾嘛，尤其是被亲哥哥亲姐姐的溺爱。那以后你不光有男朋友，男朋友不还是哥哥？哥哥以后把之前你想要的宠爱都慢慢满足你，好不好？" },
        { who: "him", text: "我宝宝的小心思，我当宝藏听的好吧。换种说法，就是我在用心去感受你的情绪，我愿意就不会累；只要这个小宝宝愿意沟通，我就觉得不会很累。" }
      ]
    },
    {
      date: "",
      bubbles: [
        { who: "me",  text: "今天对你说那三句话，我都已经有点后悔了。" },
        { who: "me",  text: "不好意思呀哥哥，我也不是故意要用这种方式对你的，下次不会了，我下次好好说话～" },
        { who: "me",  text: "哥哥，我真的是要离不开你了。不好意思，我最爱的老公宝宝～" },
        { who: "me",  text: "你难过和我难过对比起来，我更在意你难不难过。" },
        { who: "me",  text: "每次哥哥有点不舒服了，其他事都直接被我推一边去了。你最最最最最重要！！！！" }
      ]
    }
  ],

  secret: "我的心已经等你很多年～谢谢你把自己照顾得那么好，平平安安、顺顺利利长大，之后希望和你共同实现我们的美好未来——一屋，两人，三餐，四季～"
};

/* ================= 以下不用改 ================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const desk = $("#desk");
const total = CONFIG.finds.length;
const foundIdx = new Set();
const WRONG_LINES = ["这里没有哦，再找找～", "不是这个啦", "嗯……差一点", "这个只是装饰啦"];

let toastTimer = null;
function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}
function hideToast() {
  clearTimeout(toastTimer);
  $("#toast").classList.remove("show");
}

function iconSVG(name) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
}

function makeItem(cfg, cls) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "item " + cls;
  btn.style.setProperty("--x", cfg.x);
  btn.style.setProperty("--y", cfg.y);
  btn.style.setProperty("--r", cfg.r || "0deg");
  btn.innerHTML = iconSVG(cfg.icon);
  return btn;
}

function updatePips() {
  $$("#pips span").forEach((s, i) => {
    const on = foundIdx.has(i);
    s.classList.toggle("on", on);
    s.textContent = on ? "♥" : "♡";
  });
}

function onAllFound() {
  $("#hudTitle").textContent = "五件都找齐了";
  $("#hintBtn").hidden = true;
  const unlock = $("#unlock");
  unlock.hidden = false;
  unlock.classList.add("fade-in");
  toast("全都找到了，可以拆信啦。");
}

/* 真线索 */
CONFIG.finds.forEach((f, i) => {
  const btn = makeItem(f, "real");
  btn.setAttribute("aria-label", "可疑的小东西");
  btn.addEventListener("click", () => {
    if (foundIdx.has(i)) return;
    foundIdx.add(i);
    btn.classList.add("found");
    updatePips();
    toast(f.text);
    if (foundIdx.size === total) onAllFound();
  });
  desk.appendChild(btn);
});

/* 假线索 */
CONFIG.decoys.forEach((d) => {
  const btn = makeItem(d, "decoy");
  btn.setAttribute("aria-label", "可疑的小东西");
  btn.addEventListener("click", () => {
    if (btn.classList.contains("found")) return;
    btn.classList.add("shake");
    setTimeout(() => btn.classList.remove("shake"), 420);
    toast(WRONG_LINES[Math.floor(Math.random() * WRONG_LINES.length)]);
  });
  desk.appendChild(btn);
});

/* 进度小爱心 */
$("#pips").innerHTML = Array.from({ length: total }, () => "<span>♡</span>").join("");

/* 提示 */
$("#hintBtn").addEventListener("click", () => {
  const rest = $$(".item.real", desk).filter((b) => !b.classList.contains("found"));
  if (!rest.length) return;
  const el = rest[Math.floor(Math.random() * rest.length)];
  el.classList.add("hint");
  setTimeout(() => el.classList.remove("hint"), 2400);
});

/* 初始化内容 */
$("#coverName").textContent = CONFIG.hisName;
$("#letterTitle").textContent = CONFIG.letter.title;
$("#letterBody").innerHTML = CONFIG.letter.paragraphs
  .map((p) => `<p>${p}</p>`)
  .join("");
$("#letterSign").textContent = "—— 你的" + CONFIG.fromName;
if (CONFIG.letter.ps) {
  const ps = document.createElement("p");
  ps.textContent = CONFIG.letter.ps;
  ps.style.marginTop = "16px";
  $("#letterSign").before(ps);
}

$("#chats").innerHTML = CONFIG.chats
  .map(
    (g) => `
    <div class="chat-card">
      ${g.date ? `<div class="chat-date">${g.date}</div>` : ""}
      ${g.bubbles
        .map(
          (b) =>
            `<div class="bubble ${b.who === "him" ? "him" : "me"}">${b.text}</div>`
        )
        .join("")}
    </div>`
  )
  .join("");

/* 天数 */
function fillDays() {
  const start = new Date(CONFIG.startDate).getTime();
  if (Number.isNaN(start)) return;
  const days = Math.floor((Date.now() - start) / 86400000);
  $("#dayNum").textContent = days >= 1 ? days + 1 : 1;
}

/* 流程 */
$("#startBtn").addEventListener("click", () => {
  hideToast();
  $("#cover").hidden = true;
  const game = $("#game");
  game.hidden = false;
  game.classList.add("fade-in");
  window.scrollTo(0, 0);
});

$("#sealBtn").addEventListener("click", () => {
  hideToast();
  $("#game").hidden = true;
  const reward = $("#reward");
  reward.hidden = false;
  reward.classList.add("fade-in");
  fillDays();
  window.scrollTo({ top: 0, behavior: "auto" });
});

$("#finalHeart").addEventListener("click", () => {
  const el = $("#finalSecret");
  el.textContent = CONFIG.secret;
  el.classList.add("show");
  $("#finalHeart").style.animation = "none";
});
</script>
</body>
</html>
